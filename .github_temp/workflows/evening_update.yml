name: 盘后数据更新

on:
  schedule:
    # 北京时间每个交易日 18:00 (UTC 10:00)
    # 周一至周五
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # 允许手动触发
    inputs:
      date:
        description: '指定交易日期 (YYYYMMDD, 留空=自动)'
        required: false

jobs:
  fetch-evening-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install akshare pandas

      - name: 运行抓取脚本
        run: |
          python scripts/fetch_evening_data.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "📊 盘后数据更新 $(date +'%Y-%m-%d')"
          git push
