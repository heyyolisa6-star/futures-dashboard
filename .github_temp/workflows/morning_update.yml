name: 早间研报更新

on:
  schedule:
    # 北京时间每个交易日 08:30 (UTC 00:30)
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-morning-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install akshare requests beautifulsoup4

      - name: 运行研报抓取
        run: |
          python scripts/fetch_morning_reports.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports.json
          git diff --staged --quiet || git commit -m "📄 早间研报更新 $(date +'%Y-%m-%d')"
          git push
